<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <label for="weight" class="label">Weight (kg)</label>
            <input type="number" id="weight" class="input"><br>
            <label for="height" class="label">Height (cm)</label>
            <input type="number" id="height" class="input"><br>
            <button type="button" id="calculate" class="button">Calculate BMI</button>
            <div id="result"></div> 
            <div class="bmi-categories">
            <h3>BMI Categories</h3>
            <ul>
                <li>Underweight: BMI < 18.5</li>
                <li>Normal weight: BMI 18.5 - 24.9</li>
                <li>Overweight: BMI 25 - 29.9</li>
                <li>Obesity: BMI ≥ 30</li>
            </ul>   
            </div>
        </form>
    </div>    
    <script src="project2.js"></script>  
</body>
</html>
